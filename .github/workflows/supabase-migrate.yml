Gemini said
It looks like you’ve done a great job debugging the CLI limitations. You are absolutely correct: the Supabase CLI does not currently have a sql query command, and db push requires a linked project state or a direct connection string.

The Shadow User pattern and Webhook Architecture described in your documentation rely heavily on the database being correctly configured to talk to your SvelteKit API. Since supabase sql isn't an option, using the Supabase Management API via curl is the most reliable way to inject those Vault secrets during CI.

Updated GitHub Action Workflow
Here is the corrected and refined workflow based on your findings:

YAML
name: Supabase Migrations

on:
  push:
    branches: [main]

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD"

      - name: Inject Vault Secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          # Escape single quotes in WEBHOOK_URL for SQL safety
          WEBHOOK_URL_ESCAPED=$(echo "$WEBHOOK_URL" | sed "s/'/''/g")
          
          # Use Management API to execute the Vault injection
          curl -sf -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"query\": \"DELETE FROM vault.secrets WHERE name = 'webhook_url'; SELECT vault.create_secret('${WEBHOOK_URL_ESCAPED}', 'webhook_url', 'API Function URL for the DB webhook trigger');\"
            }"
          # TODO: Add custom JWT for Function auth
